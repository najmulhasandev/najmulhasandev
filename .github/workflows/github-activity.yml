name: GitHub activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reads public data only. If GitHub is unreachable the step fails and the
      # previously committed SVGs stay in place; nothing is overwritten.
      - name: Generate activity graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-github-activity.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- assets/github-activity README.md)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity README.md
          git commit -m "chore: update GitHub activity"
          git push
